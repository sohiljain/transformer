serviceName: dg-transformer
production:
  type: batch
  command:
  environmentName: cdp
  cpu: 2
  memory: 10000
  taskRole: /cdp/Services/dg-transformer/taskRole
  environmentalVariables:
  - Name: ALERT_SNS_PARAM
    Value: /cdp/SNS/Alarm

development:
  type: batch
  command:
  environmentName: cdp
  cpu: 2
  memory: 3192
  taskRole: /cdp/Services/dg-transformer/taskRole
  environmentalVariables:
  - Name: ALERT_SNS_PARAM
    Value: /dev-cdp/SNS/Alarm

