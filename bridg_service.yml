serviceName: dg-transformer
production:
  type: batch
  command:
  environmentName: cdp
  cpu: 2
  memory: 10000
  taskRole: /cdp/Services/dg-transformer/taskRole
  environmentalVariables:
  - Name: ALERT_SNS_PARAM
    Value: /cdp/SNS/Alarm
  - Name: EMR_SNS_PARAM
    Value: "arn:aws:sns:us-west-2:596832493770:dg-transformer-lambda-sns-production"

development:
  type: batch
  command:
  environmentName: dev-cdp
  cpu: 2
  memory: 3192
  taskRole: /dev-cdp/Services/data-lake-etl/taskRole
  environmentalVariables:
  - Name: ALERT_SNS_PARAM
    Value: /dev-cdp/SNS/Alarm
  - Name: EMR_SNS_PARAM
    Value: "arn:aws:sns:us-west-2:020970917333:dg-transformer-lambda-sns-development"

