###
## This file defines the serverless infrastructure on AWS for a Lambda function performing a data ingestion as a part of
## 'Dollar-general Transformer' data pipeline.
###
service: bridg-dg-transformer-function
description: 'AWS Lambda function performing dollar general data transformation step of "Data Pipeline"'
frameworkVersion: ">=1.1.0 <2.0.0"

custom:
  stages:
    - development
    - production
  function_name:
    development: bridg-dg-transformer
    production: bridg-dg-transformer
  AWS_REGION: ${env:AWS_DEFAULT_REGION}
  DEAD_LETTER_QUEUE: ${self:custom.function_name.${self:provider.stage}}-dead-letter-queue
  BRIDG_ENV_NAME: ${env:BRIDG_ENV_NAME, dev-cdp}
  BRIDG_CONFIG_URL: ${env:BRIDG_CONFIG_URL}
  BRIDG_1_ACCOUNT: ${env:BRIDG_1_ACCOUNT}
  S3_BUCKET_RAW_DATA_1: ${env:S3_BUCKET_RAW_DATA_1} # Name not ARN
#  S3_BUCKET_RAW_DATA_2: ${env:S3_BUCKET_RAW_DATA_2} # Name not ARN
#  S3_BUCKET_DATA_NORMALIZATION: ${env:S3_BUCKET_DATA_NORMALIZATION} # Name not ARN
  # first topic is to trigger lambda
  # second topic is to trigger emr
  SNS_TOPIC_ARN_1: ${env:SNS_TOPIC_ARN_1}
  SNS_TOPIC_ARN_2: ${env:SNS_TOPIC_ARN_2}
  security_group: ${env:SECURITY_GROUP, 'sg-0710b844e08d5cb2e'}  # Shall this remain same
  SUBNET_A: ${env:SUBNET_A, 'subnet-051cad2b010989d3a'}
  SUBNET_B: ${env:SUBNET_B, 'subnet-06d4b6a3c6e279276'}
  SUBNET_C: ${env:SUBNET_C, 'subnet-08f6d84463db5e1f8'}

provider:
  name: aws
  runtime: python3
  stage: ${opt:stage,'dev'}  # ?
  cfLogs: true
  description: 'AWS Lambda function performing dollar-general transformation step'
  memorySize: 512 # Overwrite the default memory size. Default is 1024.
  timeout: 600 # The default is 6
  region: ${self:custom.AWS_REGION}
  versionFunctions: false
  deploymentBucket: ${env:BRIDG_ENV_NAME}.com.serverless.${self:custom.AWS_REGION}.deploys # ? Deployment bucket name. Default is generated by the framework
  role: cdp-dollargeneral-transformer-role
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "ec2:CreateNetworkInterface"
        - "ec2:DescribeNetworkInterfaces"
        - "ec2:DetachNetworkInterface"
        - "ec2:DeleteNetworkInterface"
      Resource: "arn:aws:ec2:${self:custom.AWS_REGION}:*:*"
  vpc:
    securityGroupIds:
      - ${self:custom.security_group}
    subnetIds:
      - ${self:custom.SUBNET_A}
      - ${self:custom.SUBNET_B}
      - ${self:custom.SUBNET_C}

#package: Don't need this for now. We'll include a python zip/egg later if required
#  artifact: build/libs/data-ingestion.jar

resources: # CloudFormation template syntax
  Resources:
    cdp-dollargeneral-transformer-role:
      Type: "AWS::IAM::Role"
      Properties:
        RoleName: cdp-dollargeneral-transformer-LambdaRole-${opt:stage} #?
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
                  - events.amazonaws.com
#                  - ecs-tasks.amazonaws.com # ? Dont need this - used for ECS task assuming this role to get AWS credentials for creating Cloudwatch Rules and Events
              Action: sts:AssumeRole
        # note that these rights are needed if you want your function to be able to communicate with resources within your vpc
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        Policies:
          - PolicyName: cdp-dollargeneral-transformer-SchedulerPolicy-${opt:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ecs:RunTask
                  Resource: "arn:aws:ecs:${self:custom.AWS_REGION}:*:*"
                - Effect: Allow
                  Action:
                    - ecs:ListTasks
                  Resource: "arn:aws:ecs:${self:custom.AWS_REGION}:*:*"
                - Effect: Allow # note that these rights are given in the default policy and are required if you want logs out of your lambda(s)
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                    - logs:GetLogEvents
                  Resource: "arn:aws:logs:${self:custom.AWS_REGION}:*:log-group:/aws/lambda/*:*:*"
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                    - lambda:GetFunction
                  Resource: "arn:aws:lambda:${self:custom.AWS_REGION}:*:function:${self:custom.function_name.${self:provider.stage}}"
                - Effect: Allow
                  Action:
                    - events:*
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - s3:*
                  Resource:
                    - "arn:aws:s3:::${self:custom.S3_BUCKET_RAW_DATA_1}/*"
                    - "arn:aws:s3:::${self:custom.S3_BUCKET_RAW_DATA_1}"
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource: "arn:aws:sqs:${self:custom.AWS_REGION}:*:${self:custom.DEAD_LETTER_QUEUE}" # ? - Do i need to add sns in policy
    SQSQueueDeadLetter:
      Type: "AWS::SQS::Queue"
      Properties:
        QueueName: ${self:custom.DEAD_LETTER_QUEUE}
        MessageRetentionPeriod: 1209600
    CopyToDataLakeLambdaFunction: # ? - Don't get this
      Type: "AWS::Lambda::Function"
      Properties:
        DeadLetterConfig:
          TargetArn:
            "Fn::GetAtt":
              - SQSQueueDeadLetter
              - Arn
    CopyToDataLakeLambdaPermissionRawdata1S3:
      # We must create this add permission after creating the function.
      # This is necessary for function to be invokable via cloudwatch event
      # Read to Make sure:: https://github.com/aws/aws-sdk-java/issues/737
      DependsOn:
        - CopyToDataLakeLambdaFunction
      Type: "AWS::Lambda::Permission"
      Properties:
        Action: "lambda:InvokeFunction"
        FunctionName:
          "Fn::GetAtt":
            - CopyToDataLakeLambdaFunction
            - Arn
        Principal: "sns.amazonaws.com"
        SourceAccount: ${self:custom.BRIDG_1_ACCOUNT}
        SourceArn: ${self:custom.SNS_TOPIC_ARN_1}

functions:
  CopyToDataLake:
    name: ${self:custom.function_name.${self:provider.stage}}
    description: "AWS Lambda function performing dollar generaal transformation step of 'Data Pipeline'."
    handler: com.bridg.data.ingestion.SpringDataIngestionRequestHandler
    events:
      - sns: ${self:custom.SNS_TOPIC_ARN_1}
      - sns: ${self:custom.SNS_TOPIC_ARN_2}
    environment:
      BRIDG_ENV_NAME: ${self:custom.BRIDG_ENV_NAME}
      BRIDG_CONFIG_URL: ${self:custom.BRIDG_CONFIG_URL}
    tags:
      Environment: ${self:custom.BRIDG_ENV_NAME}