Name: cdp-dg-transformer-emr-cluster
LogUri: "s3://bridg-client-ftp/dollargeneral/transformed/logs"
ReleaseLabel: "emr-5.27.0"
Applications:
    - Name: "Spark"
Configurations:
    - Classification: spark-env
      Configurations:
        - Classification: export
          Properties:
            PYSPARK_PYTHON: "/usr/bin/python3"
Instances:
    HadoopVersion: Amazon 2.8.5
    InstanceGroups:
    - Name: Master nodes
      Market: ON_DEMAND
      InstanceRole: MASTER
      InstanceType: m4.large
      InstanceCount: 1
      EbsConfiguration:
        EbsBlockDeviceConfigs:
        - VolumeSpecification:
            VolumeType: gp2
            SizeInGB: 20
          VolumesPerInstance: 1
        EbsOptimized: True
    - Name: Slave nodes
      Market: ON_DEMAND
      InstanceRole: CORE
      InstanceType: r5.xlarge
      InstanceCount: 1
      EbsConfiguration:
        EbsBlockDeviceConfigs:
        - VolumeSpecification:
            VolumeType: gp2
            SizeInGB: 100
          VolumesPerInstance: 1
        EbsOptimized: True
    - Name: Slave nodes
      Market: ON_DEMAND
      InstanceRole: TASK
      InstanceType: r5.xlarge
      InstanceCount: 1
      EbsConfiguration:
        EbsBlockDeviceConfigs:
        - VolumeSpecification:
            VolumeType: gp2
            SizeInGB: 100
          VolumesPerInstance: 1
        EbsOptimized: True
    Ec2KeyName: cdp-admin
    KeepJobFlowAliveWhenNoSteps: False
    TerminationProtected: False
    Ec2SubnetId: subnet-080ca4bae7f28e8a9
Steps:
    - Name: transformer
      ActionOnFailure: TERMINATE_CLUSTER
      HadoopJarStep:
        Properties:
        - Key: PYSPARK_PYTHON
          Value: "/usr/bin/python3"
        Jar: command-runner.jar
        Args:
        - sudo
        - pip-3.6
        - install
        - boto3
    - Name: transformer
      ActionOnFailure: TERMINATE_CLUSTER
      HadoopJarStep:
        Properties:
        - Key: PYSPARK_PYTHON
          Value: "/usr/bin/python3"
        Jar: command-runner.jar
        Args:
        - spark-submit
        - CODE_DIR
VisibleToAllUsers: True
JobFlowRole: "EMR_EC2_DefaultRole"
ServiceRole: "EMR_DefaultRole"
ScaleDownBehavior: "TERMINATE_AT_TASK_COMPLETION"